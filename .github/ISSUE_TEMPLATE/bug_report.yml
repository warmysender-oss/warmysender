name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security issues must not be reported here** — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: dropdown
    id: deployment
    attributes:
      label: How are you running it?
      options:
        - Docker Compose
        - Coolify
        - Dokploy
        - Portainer
        - Railway
        - From source
        - Other
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, database, mailbox provider (Google, Microsoft, SMTP).
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. Remove any secrets, tokens or email addresses first.
      render: shell
