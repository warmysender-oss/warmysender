# One Railway service: build the repository Dockerfile and start its CMD.
# deploy.healthcheckPath is /health (GET /health -> 200 { ok: true }).
# deploy.startCommand is unset so the image CMD starts the app
# (node apps/server/dist/index.js). The worker is a second service.
# Railway's config-as-code docs mark this file format deprecated for new
# services (existing files keep working until 2026-12-01). The build spec
# still asks for railway.toml. See docs/self-hosting/railway.md.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# GET /health returns 200 { ok: true } (apps/server/src/app.ts).
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
